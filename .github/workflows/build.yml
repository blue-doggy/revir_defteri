name: Build and Release (Windows & macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Derleme sonrası GitHub Release (Sürüm) oluştur/güncelle'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64 (.exe Kurulum)
            artifact_name: revir-defteri-windows
          - os: macos-latest
            label: macOS Apple Silicon arm64 (.dmg)
            artifact_name: revir-defteri-macos-arm64

    steps:
      - name: Kodu indir (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Sürüm bilgisini belirle ve senkronize et
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${APP_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              python bump_version.py "${APP_VERSION}"
            else
              echo "${APP_VERSION}" > VERSION
            fi
          else
            APP_VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=${APP_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Derlenecek sürüm: v${APP_VERSION}"

      - name: Bağımlılıkları kur
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt pyinstaller

      - name: PyInstaller ile uygulamayı derle
        shell: bash
        run: |
          python -m PyInstaller RevirDefteri.spec --clean -y

      - name: Windows SHA-256 Dijital İmzalama ve Inno Setup Kurulum (.exe) Üretimi
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $appExe = "dist\RevirDefteri\RevirDefteri.exe"
          if (-not (Test-Path $appExe)) {
            Write-Error "PyInstaller çıktısı bulunamadı: $appExe"
            exit 1
          }

          # 1. Ücretsiz 10 Yıllık SHA-256 Code Signing Sertifikası Oluştur (.pfx & .cer)
          Write-Host "SHA-256 Kod İmzalama Sertifikası üretiliyor..."
          $certPwdPlain = "RevirDefteri_Sign_2026!"
          $certPwd = ConvertTo-SecureString -String $certPwdPlain -Force -AsPlainText
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=Okul Revir Defteri ve Saglik Takip Sistemi, O=Okul Sagligi ve Revir Bilgi Sistemi, C=TR" `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm "SHA256" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(10)

          $pfxPath = "RevirDefteri_CodeSign.pfx"
          $cerPath = "dist\RevirDefteri\RevirDefteri_RootCA.cer"
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $certPwd | Out-Null
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null

          # 2. Windows SDK signtool.exe konumunu bul
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signtool) {
            $kitHits = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
              Sort-Object FullName -Descending
            if ($kitHits) { $signtool = $kitHits[0].FullName }
          }

          function Invoke-RevirSign([string]$TargetFile) {
            if ($signtool -and (Test-Path $signtool)) {
              Write-Host "signtool ile imzalanıyor: $TargetFile"
              & $signtool sign /f $pfxPath /p $certPwdPlain /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 /d "Okul Revir Defteri ve Saglik Takip Sistemi" $TargetFile
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Zaman damgası sunucusuna erişilemedi, yerel SHA-256 imza uygulanıyor..."
                & $signtool sign /f $pfxPath /p $certPwdPlain /fd SHA256 /d "Okul Revir Defteri ve Saglik Takip Sistemi" $TargetFile
              }
            } else {
              Write-Host "Set-AuthenticodeSignature ile imzalanıyor: $TargetFile"
              Set-AuthenticodeSignature -FilePath $TargetFile -Certificate $cert -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com" | Out-Null
            }
          }

          # 3. Ana uygulama EXE dosyasını imzala
          Invoke-RevirSign $appExe

          # 4. Inno Setup (ISCC.exe) ile kurulum sihirbazını derle
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $candidates = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe",
              "C:\Program Files (x86)\Inno Setup 7\ISCC.exe",
              "C:\Program Files\Inno Setup 7\ISCC.exe"
            )
            foreach ($p in $candidates) {
              if (Test-Path $p) { $iscc = $p; break }
            }
          }

          if (-not $iscc) {
            Write-Host "ISCC.exe bulunamadı, Chocolatey üzerinden Inno Setup kuruluyor..."
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }

          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup Compiler (ISCC.exe) kurulamadı veya bulunamadı."
            exit 1
          }

          New-Item -ItemType Directory -Force -Path "installer" | Out-Null
          New-Item -ItemType Directory -Force -Path "release_assets" | Out-Null

          & $iscc "RevirDefteri_Setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $setupPath = "installer\RevirDefteri_Kurulum_v$env:APP_VERSION.exe"
          if (-not (Test-Path $setupPath)) {
            Write-Error "Beklenen kurulum dosyası üretilemedi: $setupPath"
            exit 1
          }

          # 5. Üretilen Kurulum Sihirbazı (.exe) dosyasını da imzala ve doğrula
          Invoke-RevirSign $setupPath
          Remove-Item -Path $pfxPath -Force -ErrorAction SilentlyContinue

          $sigInfo = Get-AuthenticodeSignature -FilePath $setupPath
          Write-Host "İmza Durumu: $($sigInfo.Status) | İmzalayan: $($sigInfo.SignerCertificate.Subject)"

          Copy-Item -Path $setupPath -Destination "release_assets\" -Force
          Get-ChildItem "release_assets"

      - name: macOS .app Entitlements ile İmzala ve .dmg Paketini Oluştur
        if: runner.os == 'macOS'
        shell: bash
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ ! -d "dist/RevirDefteri.app" ]; then
            echo "HATA: dist/RevirDefteri.app oluşturulamadı!"
            exit 1
          fi

          # Apple Silicon (arm64) üzerinde entitlements.plist ile derin ad-hoc imza uygula ve doğrula
          codesign --force --deep --entitlements entitlements.plist --sign - "dist/RevirDefteri.app"
          codesign --verify --deep --strict --verbose=2 "dist/RevirDefteri.app"

          STAGE_DIR="dist/dmg_stage"
          rm -rf "${STAGE_DIR}" release_assets
          mkdir -p "${STAGE_DIR}" release_assets

          cp -R "dist/RevirDefteri.app" "${STAGE_DIR}/"
          ln -s /Applications "${STAGE_DIR}/Applications"

          # macOS Gatekeeper karantina kilidini tek çift tıklamayla kaldıran yardımcı betik
          cat << 'EOF' > "${STAGE_DIR}/Ilk_Acilis_Izni_Ver.command"
          #!/bin/bash
          echo "================================================================"
          echo "  Okul Revir Defteri - macOS İlk Açılış İzni ve İmza Doğrulama"
          echo "================================================================"
          DIR="$(cd "$(dirname "$0")" && pwd)"
          if [ -d "/Applications/RevirDefteri.app" ]; then
            xattr -cr "/Applications/RevirDefteri.app" 2>/dev/null || true
            echo "[OK] /Applications/RevirDefteri.app güvenlik izni tanımlandı."
            open "/Applications/RevirDefteri.app"
          elif [ -d "${DIR}/RevirDefteri.app" ]; then
            xattr -cr "${DIR}/RevirDefteri.app" 2>/dev/null || true
            echo "[OK] RevirDefteri.app güvenlik izni tanımlandı."
            open "${DIR}/RevirDefteri.app"
          else
            echo "Lütfen önce RevirDefteri.app uygulamasını Applications klasörüne sürükleyin."
          fi
          EOF
          chmod +x "${STAGE_DIR}/Ilk_Acilis_Izni_Ver.command"

          DMG_PATH="release_assets/RevirDefteri_macOS_arm64_v${APP_VERSION}.dmg"
          hdiutil create \
            -volname "Okul Revir Defteri v${APP_VERSION}" \
            -srcfolder "${STAGE_DIR}" \
            -ov \
            -format UDZO \
            "${DMG_PATH}"

          codesign --force --sign - "${DMG_PATH}" || true
          ls -lh release_assets/

      - name: Derleme çıktısını Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release_assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
    steps:
      - name: Windows ve macOS derleme çıktılarını indir
        uses: actions/download-artifact@v4
        with:
          path: release_files
          merge-multiple: true

      - name: Yayınlanacak dosyaları kontrol et
        run: ls -lh release_files/

      - name: GitHub Release oluştur ve dosyaları ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.build.outputs.version) }}
          name: Okul Revir Defteri v${{ needs.build.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release_files/*
